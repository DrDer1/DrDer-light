<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="DrDer-Light — متاهة ذهبية ثلاثية الأبعاد.">
  <title>DrDer-Light</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./192.png">
  <link rel="apple-touch-icon" href="./192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app" class="app landscape-mode">
    
    <div id="startScreen" class="start-screen">
      <h1 class="start-title">DrDer-Light</h1>
      <div class="start-actions">
        <button id="startBtn" class="start-btn">بداية اللعب</button>
        <button id="continueBtn" class="start-btn secondary" style="display:none;">استمرار اللعب</button>
      </div>
      <div class="copyright">كل الحقوق محفوظة DrDer 2026</div>
    </div>

    <main id="gameUI" class="game-ui" style="display:none;">
      <button id="menuBtn" class="menu-btn" aria-label="القائمة">☰</button>

      <div id="dropdownMenu" class="dropdown-menu" style="display:none;">
        <button id="pauseButton" class="dropdown-item">إيقاف مؤقت</button>
        <button id="restartButton" class="dropdown-item">إعادة المرحلة</button>
        <button id="nextButton" class="dropdown-item" disabled>المرحلة التالية</button>
        <button id="exitBtn" class="dropdown-item">إنهاء اللعب</button>
      </div>

      <section class="game-frame">
        <canvas id="gameCanvas">متصفحك لا يدعم عرض اللعبة.</canvas>
      </section>

      <div id="leftJoystick" class="joystick-area left"></div>
      <div id="rightJoystick" class="joystick-area right"></div>
    </main>
  </div>

  <script src="./engine.js" defer></script>
</body>
</html>

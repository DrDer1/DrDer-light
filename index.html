
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="DrDer-light — متاهة ذهبية، اجمع البلورات واعثر على البوابة.">
  <title>DrDer-light</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./192.png">
  <link rel="stylesheet" href="./style.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #141414;
      --gold: #e9b83f;
      --gold-light: #ffdf79;
      --text: #f7f0dd;
      --muted: #a9a18e;
      --border: #39301c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 10%, #21190a 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 14px
        max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 13px;
    }

    .brand h1 {
      margin: 0;
      color: var(--gold-light);
      font-size: 22px;
      letter-spacing: 0.4px;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .icon-button,
    .action-button,
    .direction-button {
      border: 1px solid var(--border);
      color: var(--gold-light);
      background: linear-gradient(145deg, #1d1a13, #101010);
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .icon-button {
      min-width: 44px;
      min-height: 44px;
      font-size: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 11px 4px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: linear-gradient(145deg, #181818, #101010);
      text-align: center;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .stat-value {
      display: block;
      color: var(--gold-light);
      font-size: 17px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .game-frame {
      position: relative;
      width: 100%;
      height: clamp(330px, 53vh, 510px);
      min-height: 300px;
      overflow: hidden;
      border: 1px solid #47391b;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 50% 40%, #171208, #080808 72%);
      box-shadow:
        0 0 24px #b17b1412,
        inset 0 0 25px #000;
      touch-action: pan-y;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .game-caption {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
      margin: -5px 4px 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 56px);
      justify-content: center;
      gap: 7px;
      direction: ltr;
    }

    .direction-button {
      font-size: 24px;
      font-weight: 700;
      border-radius: 15px;
      box-shadow: inset 0 1px #ffffff0a;
    }

    .direction-button:active,
    .action-button:active,
    .icon-button:active {
      transform: scale(0.96);
      background: #30230c;
    }

    #moveUp {
      grid-column: 2;
      grid-row: 1;
    }

    #moveLeft {
      grid-column: 1;
      grid-row: 2;
    }

    #moveDown {
      grid-column: 2;
      grid-row: 2;
    }

    #moveRight {
      grid-column: 3;
      grid-row: 2;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .action-button {
      min-height: 47px;
      padding: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .footer {
      margin-top: auto;
      padding-top: 5px;
      color: #756b55;
      font-size: 11px;
      text-align: center;
    }

    @media (max-height: 700px) {
      .app {
        gap: 9px;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .game-frame {
        height: 38vh;
        min-height: 250px;
      }

      .controls {
        grid-template-rows: repeat(2, 46px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img src="./192.png" alt="DrDer-light">
        <div>
          <h1>DrDer-light</h1>
          <p>اجمع البلورات وافتح البوابة</p>
        </div>
      </div>

      <button class="icon-button" id="pauseButton"
        type="button" aria-label="إيقاف اللعبة مؤقتًا"
        title="إيقاف مؤقت">Ⅱ</button>
    </header>

    <section class="stats" aria-label="إحصائيات المرحلة">
      <div class="stat">
        <span class="stat-label">المرحلة</span>
        <span class="stat-value" id="levelValue">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">الحركات</span>
        <span class="stat-value" id="movesValue">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">البلورات</span>
        <span class="stat-value" id="crystalsValue">0/2</span>
      </div>
      <div class="stat">
        <span class="stat-label">الوقت</span>
        <span class="stat-value" id="timeValue">00:00</span>
      </div>
    </section>

    <section class="game-frame" aria-label="لوحة المتاهة">
      <canvas id="gameCanvas">
        متصفحك لا يدعم عرض اللعبة.
      </canvas>
    </section>

    <p class="game-caption">
      حرّك الكرة الذهبية عبر الممرات، واجمع البلورتين ثم ادخل البوابة المضيئة.
      يمكنك السحب على اللوحة أو استخدام أزرار الاتجاهات.
    </p>

    <section class="controls" aria-label="أزرار الحركة">
      <button class="direction-button" id="moveUp"
        type="button" aria-label="تحرك للأعلى">↑</button>
      <button class="direction-button" id="moveLeft"
        type="button" aria-label="تحرك لليسار">←</button>
      <button class="direction-button" id="moveDown"
        type="button" aria-label="تحرك للأسفل">↓</button>
      <button class="direction-button" id="moveRight"
        type="button" aria-label="تحرك لليمين">→</button>
    </section>

    <section class="actions">
      <button class="action-button" id="restartButton" type="button">
        ↻ إعادة المرحلة
      </button>
      <button class="action-button" id="nextButton" type="button">
        المرحلة التالية ›
      </button>
    </section>

    <footer class="footer">
      DrDer-light · متاهة الظلال الذهبية
    </footer>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const app = {
        canvas,
        ctx,
        resizeCanvas,
        updateStats
      };

      window.DrDerLight = app;

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.max(1, Math.round(rect.width * ratio));
        canvas.height = Math.max(1, Math.round(rect.height * ratio));

        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        /*
         * Keep logical dimensions in CSS pixels for the renderer.
         */
        canvas.width = Math.max(1, Math.round(rect.width));
        canvas.height = Math.max(1, Math.round(rect.height));
      }

      function updateStats(stats) {
        if (!stats) return;

        document.getElementById('levelValue').textContent =
          String(stats.level ?? 1);
        document.getElementById('movesValue').textContent =
          String(stats.moves ?? 0);
        document.getElementById('crystalsValue').textContent =
          `${stats.collected ?? 0}/${stats.crystals ?? 2}`;

        const total = Math.floor(stats.time ?? 0);
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;

        document.getElementById('timeValue').textContent =
          `${String(minutes).padStart(2, '0')}:` +
          `${String(seconds).padStart(2, '0')}`;

        document.getElementById('pauseButton').textContent =
          stats.paused ? '▶' : 'Ⅱ';
      }

      function sendMove(direction) {
        document.dispatchEvent(new CustomEvent('drder:move', {
          detail: { direction }
        }));
      }

      const buttons = {
        moveUp: 'up',
        moveDown: 'down',
        moveLeft: 'left',
        moveRight: 'right'
      };

      Object.entries(buttons).forEach(([id, direction]) => {
        document.getElementById(id).addEventListener('click', () => {
          sendMove(direction);
        });
      });

      document.getElementById('restartButton').addEventListener('click', () => {
        document.dispatchEvent(new Event('drder:restart'));
      });

      document.getElementById('pauseButton').addEventListener('click', () => {
        document.dispatchEvent(new Event('drder:pause'));
      });

      document.getElementById('nextButton').addEventListener('click', () => {
        document.dispatchEvent(new Event('drder:next'));
      });

      let startX = 0;
      let startY = 0;

      canvas.addEventListener('pointerdown', event => {
        startX = event.clientX;
        startY = event.clientY;
      });

      canvas.addEventListener('pointerup', event => {
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;

        if (Math.abs(dx) > Math.abs(dy)) {
          sendMove(dx > 0 ? 'right' : 'left');
        } else {
          sendMove(dy > 0 ? 'down' : 'up');
        }
      });

      function fitCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(rect.width));
        canvas.height = Math.max(1, Math.round(rect.height));
      }

      window.addEventListener('resize', fitCanvas);
      window.addEventListener('orientationchange', fitCanvas);

      fitCanvas();

      /*
       * Load the game engine only after the interface is ready.
       * This does not register or enable a Service Worker.
       */
      const engine = document.createElement('script');
      engine.src = './engine.js';
      engine.async = false;
      engine.onerror = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#080808';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffdf79';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(
          'تعذّر تحميل engine.js',
          canvas.width / 2,
          canvas.height / 2
        );
      };
      document.body.appendChild(engine);
    })();
  </script>
</body>
</html>

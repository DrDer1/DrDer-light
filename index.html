<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="DrDer-Light — متاهة ذهبية ثلاثية الأبعاد. اجمع البلورتين واعثر على البوابة المضيئة.">
  <title>DrDer-Light</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./192.png">
  <link rel="apple-touch-icon" href="./192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img src="./192.png" alt="DrDer-Light">
        <div class="brand-text">
          <h1>DrDer-Light</h1>
          <p>اجمع البلورتين وافتح البوابة</p>
        </div>
      </div>

      <button class="icon-button" id="pauseButton"
        type="button" aria-label="إيقاف اللعبة مؤقتًا"
        title="إيقاف مؤقت">Ⅱ</button>
    </header>

    <section class="stats" aria-label="إحصائيات المرحلة">
      <div class="stat">
        <span class="stat-label">المرحلة</span>
        <span class="stat-value" id="levelValue">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">البلورات</span>
        <span class="stat-value" id="crystalsValue">0/2</span>
      </div>
      <div class="stat">
        <span class="stat-label">الوقت</span>
        <span class="stat-value" id="timeValue">00:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">الأفضل</span>
        <span class="stat-value" id="bestValue">--:--</span>
      </div>
    </section>

    <section class="game-frame" aria-label="لوحة المتاهة">
      <canvas id="gameCanvas">
        متصفحك لا يدعم عرض اللعبة.
      </canvas>
    </section>

    <p class="game-caption" id="caption">
      اسحب لأعلى للتقدم · يمينًا ويسارًا لتغيير المسار
    </p>

    <section class="actions">
      <button class="action-button" id="restartButton" type="button">
        ↻ إعادة المرحلة
      </button>
      <button class="action-button" id="nextButton" type="button" disabled>
        المرحلة التالية ›
      </button>
    </section>

    <footer class="footer">
      DrDer-Light · متاهة الظلال الذهبية
    </footer>
  </main>

  <script src="./engine.js" defer></script>
</body>
</html>
